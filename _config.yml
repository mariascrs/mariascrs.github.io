# ---------------------------------------------------------------
#  Site settings — the things you are most likely to edit
# ---------------------------------------------------------------

title: Maria Corte-Real Santos
description: >-
  Postdoctoral researcher at ENS de Lyon, working on isogeny-based
  cryptography and computational number theory.
url: "https://www.mariascrs.com"
baseurl: ""

author:
  name: Maria Corte-Real Santos
  email: maria.corte_real_santos@ens-lyon.fr

# Icons shown under your photo. Leave a value empty ("") to hide that icon.
social:
  email: maria.corte_real_santos@ens-lyon.fr
  scholar: ""        # full Google Scholar profile URL
  github: mariascrs
  linkedin: maria-corte-real-santos-805a5a14a
  bluesky: ""        # handle, e.g. mariascrs.bsky.social

# Top navigation, in order.
navigation:
  - title: Publications
    url: /publications.html
  - title: Projects
    url: /projects.html
  - title: Writing
    url: /posts.html
  - title: Talks
    url: /talks.html
  - title: Service
    url: /service.html

# Google Analytics measurement ID (leave empty to disable).
google_analytics: G-GGT4FHFFVP

# ---------------------------------------------------------------
#  Build settings — you shouldn't need to touch these
# ---------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

# Keeps existing post URLs, e.g. /2023/01/09/splitsearcher.html
permalink: date

excerpt_separator: <!--more-->

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      mathjax: true
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
