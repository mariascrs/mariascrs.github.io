<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Main">
    {%- for item in site.navigation -%}
      {%- assign current = false -%}
      {%- if page.url == item.url -%}{%- assign current = true -%}{%- endif -%}
      {%- if item.url == "/posts.html" and page.collection == "posts" -%}{%- assign current = true -%}{%- endif -%}
      <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor -%}
    <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <span class="icon-moon">{% include icon.html name="moon" %}</span>
      <span class="icon-sun">{% include icon.html name="sun" %}</span>
    </button>
  </nav>
</header>
