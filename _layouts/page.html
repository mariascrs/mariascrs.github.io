---
layout: default
---
<article class="page{% if page.image %} page-with-image{% endif %}">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.intro %}<p class="page-intro">{{ page.intro | markdownify | remove: "<p>" | remove: "</p>" | strip }}</p>{% endif %}
  </header>
  {%- if page.image %}
  <figure class="page-figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}" loading="lazy">
    {%- if page.image_credit %}<figcaption>{{ page.image_credit }}</figcaption>{% endif %}
  </figure>
  {%- endif %}
  <div class="page-body{% unless page.list %} prose{% endunless %}">
    {{ content }}
  </div>
</article>
